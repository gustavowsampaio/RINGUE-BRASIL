<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ringue Brasil | Conte para nós</title>
    <link rel="stylesheet" href="./css/estilo.css">
    <!-- Define o ícone da aba do navegador. -->
    <link rel="icon" type="image/svg+xml" href="/assets/icon/bandeira-ringue-brasil.svg">
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
</head>

<body>
    <!-- Barra de navegação do site. -->
        <!-- Contêiner compartilhado da barra de navegação. -->
    <div class="cabecalho">
        <div class="container-navbar">
            <div class="logo">
                <img src="css/WWEbrasilLOGO.png" alt="Logo Ringue Brasil">
            </div>

            <div class="menu">
                <a href="index.html">Início</a>
                <a href="index.html#sobre">Sobre</a>
            </div>

            <div class="botao-entrar">
                <a href="login.html">ENTRAR</a>
            </div>
        </div>
    </div>

    <div class="experiencia" role="main">
        <p class="experiencia-etiqueta">Sua experiência</p>
        <h1>Conte para nós</h1>

        <!-- Formulário de avaliação do site. -->
        <form class="experiencia-formulario">
            <div class="experiencia-perguntas">
                <div class="grupo-avaliacao" role="group" aria-labelledby="pergunta-avaliacao-1">
                    <p class="titulo-pergunta" id="pergunta-avaliacao-1">Sua experiência com o site</p>
                    <div class="experiencia-opcoes">
                        <label>
                            <input type="radio" name="nota" value="1" aria-label="1 estrela">
                            <span aria-hidden="true">★</span>
                        </label>
                        <label>
                            <input type="radio" name="nota" value="2" aria-label="2 estrelas">
                            <span aria-hidden="true">★</span>
                        </label>
                        <label>
                            <input type="radio" name="nota" value="3" aria-label="3 estrelas">
                            <span aria-hidden="true">★</span>
                        </label>
                        <label>
                            <input type="radio" name="nota" value="4" aria-label="4 estrelas">
                            <span aria-hidden="true">★</span>
                        </label>
                        <label>
                            <input type="radio" name="nota" value="5" aria-label="5 estrelas">
                            <span aria-hidden="true">★</span>
                        </label>
                    </div>
                </div>

                <div class="grupo-avaliacao" role="group" aria-labelledby="pergunta-avaliacao-2">
                    <p class="titulo-pergunta" id="pergunta-avaliacao-2">O site te ajudou a criar interesse em luta livre?</p>
                    <div class="experiencia-opcoes">
                        <label>
                            <input type="radio" name="interesse" value="nao">
                            <span class="experiencia-nao"><span aria-hidden="true">👎</span> Não</span>
                        </label>
                        <label>
                            <input type="radio" name="interesse" value="sim">
                            <span class="experiencia-sim"><span aria-hidden="true">👍</span> Sim</span>
                        </label>
                    </div>
                </div>
            </div>

            <label for="comentario">Nos conte sobre sua experiência</label>
            <textarea id="comentario" name="comentario" rows="3" maxlength="250"></textarea>
            <button type="submit" class="botao-avaliacao">Enviar avaliação</button>
            <p id="status-avaliacao" class="status-avaliacao" role="status"></p>
        </form>
    </div>
        <script>
        // Lê o ID do usuário para enviar a avaliação.
        var idUsuario = Number(sessionStorage.ID_USUARIO);
        if (!Number.isInteger(idUsuario) || idUsuario < 1) {
            window.location.replace("/login.html");
        }

        var formulario = document.querySelector(".experiencia-formulario");

        // Lê o formulário e envia a avaliação para a API.
        formulario.addEventListener("submit", async function (evento) {
            evento.preventDefault();

            var status = document.getElementById("status-avaliacao");
            var dados = new FormData(formulario);
            var nota = dados.get("nota");
            var interesse = dados.get("interesse");

            if (!nota || !interesse) {
                status.textContent = "Escolha uma nota e responda Sim ou Não.";
                return;
            }

            var botao = formulario.querySelector("button[type='submit']");
            botao.disabled = true;
            status.textContent = "Enviando avaliação...";

            try {
                var resposta = await fetch("/avaliacoes/cadastrar", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        idUsuario: idUsuario,
                        nota: Number(nota),
                        interesse: interesse,
                        comentario: dados.get("comentario")
                    })
                });

                status.textContent = await resposta.text();

                if (resposta.ok) {
                    formulario.reset();
                }
            } catch (erro) {
                status.textContent = "Não foi possível conectar ao servidor.";
            } finally {
                botao.disabled = false;
            }
        });
    </script>
</body>

</html>
