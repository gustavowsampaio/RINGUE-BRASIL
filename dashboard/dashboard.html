</div>

<script>
    if (sessionStorage.NOME_USUARIO) {
        document.getElementById("b_usuario").textContent = " · " + sessionStorage.NOME_USUARIO;
    }

    var abaAvaliacoes = document.getElementById("abaAvaliacoes");
    var abaComentarios = document.getElementById("abaComentarios");
    var graficoNotas;
    var graficoInteresse;

// Cria os gráficos e atualiza seus valores.
function atualizarGraficos(resumo) {
    var notas = [
        Number(resumo.nota5),
        Number(resumo.nota4),
        Number(resumo.nota3),
        Number(resumo.nota2),
        Number(resumo.nota1)
    ];

    var totalSim = Number(resumo.totalSim);
    var totalNao = Number(resumo.totalNao);

    if (!graficoNotas) {
        graficoNotas = new Chart(document.getElementById("graficoNotas"), {
            type: "bar",
            data: {
                labels: ["5 ★", "4 ★", "3 ★", "2 ★", "1 ★"],
                datasets: [{
                    label: "Avaliações",
                    backgroundColor: "#dedee2"
                }]
            },
            options: {
                indexAxis: "y",
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    x: { beginAtZero: true, ticks: { precision: 0, color: "#dedee2" } },
                    y: { ticks: { color: "#dedee2" } }
                }
            }
        });

        graficoInteresse = new Chart(document.getElementById("graficoInteresse"), {
            type: "bar",
            data: {
                labels: ["Respostas"],
                datasets: [
                    { label: "Sim", backgroundColor: "#53c991" },
                    { label: "Não", backgroundColor: "#ff7575" }
                ]
            },
            options: {
                indexAxis: "y",
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    x: { stacked: true, beginAtZero: true, ticks: { precision: 0, color: "#dedee2" } },
                    y: { stacked: true, display: false }
                }
            }
        });
    }

    graficoNotas.data.datasets[0].data = notas;
    graficoInteresse.data.datasets[0].data = [totalSim];
    graficoInteresse.data.datasets[1].data = [totalNao];

    document.getElementById("legendaSim").textContent = "Sim · " + totalSim;
    document.getElementById("legendaNao").textContent = "Não · " + totalNao;

    graficoNotas.update();
    graficoInteresse.update();
}

// Busca os comentários na API e mostra nas duas abas.
async function carregarComentarios() {
    var lista = document.getElementById("listaComentarios");
    var status = document.getElementById("statusComentarios");
    var recentes = document.getElementById("comentariosRecentes")

    status.textContent = "Carregando comentários...";
    try {
        var resposta = await fetch("/avaliacoes/comentarios", {
            cache: "no-store"
        });
        if (!resposta.ok) {
            status.textContent = await resposta.text();
            return;
        }
        var comentarios = await resposta.json();
        lista.replaceChildren();
        recentes.replaceChildren();
        if (comentarios.length === 0) {
            status.textContent = "Nenhum comentário recebido ainda.";
            recentes.textContent = "Nenhum comentário recebido ainda."
            return;
        }


       

        status.textContent = "";

        comentarios.forEach(function (item, indice) {
            var linha = document.createElement("div");
            linha.className = "comentario comentario-completo";

            var texto = document.createElement("p");
            texto.textContent = item.comentario;

            var detalhes = document.createElement("p");
            detalhes.className = "detalhe meta-comentario";

            var data = new Date(item.criado_em).toLocaleString("pt-BR");
            detalhes.textContent = item.nome + " · " + data;

            var notaComentario = document.createElement("b");
            notaComentario.className = "nota-comentario";
            notaComentario.textContent = "★ " + item.nota + " de 5";
            detalhes.appendChild(notaComentario);

            var respostaInteresse = document.createElement("span");
            respostaInteresse.textContent = "Interesse: ";

            var valorInteresse = document.createElement("b");
            var temInteresse = item.interesse === "sim";
            valorInteresse.textContent = temInteresse ? "Sim" : "Não";
            valorInteresse.className = temInteresse ? "sim" : "nao";

            respostaInteresse.appendChild(valorInteresse);
            detalhes.appendChild(respostaInteresse);

            linha.appendChild(texto);
            linha.appendChild(detalhes);
            lista.appendChild(linha);

            if(indice < 2) {
                recentes.appendChild(linha.cloneNode(true));
            }
        });

    } catch (erro) {
        status.textContent = "Não foi possível carregar os comentários.";
    }
}

    // Alterna entre Gráficos e Comentários.
    function mostrarComentarios(mostrar) {
        document.getElementById("avaliacoes").hidden = mostrar;
        document.getElementById("comentarios").hidden = !mostrar;
        document.getElementById("alerta").hidden = mostrar;
        document.getElementById("btnAquario").hidden = mostrar;
        document.getElementById("graficos").hidden = mostrar;
        abaAvaliacoes.setAttribute("aria-pressed", !mostrar);
        abaComentarios.setAttribute("aria-pressed", mostrar);
    }
           

    abaAvaliacoes.addEventListener("click", function () {
        mostrarComentarios(false);
    });

    abaComentarios.addEventListener("click", function () {
        mostrarComentarios(true);
    });
// Busca os dados reais e preenche os cartões e gráficos.
async function carregarResumo() {
    var status = document.getElementById("statusResumo");

    try {
        var resposta = await fetch("/avaliacoes/resumo", {
            cache: "no-store"
        });

        if (!resposta.ok) {
            status.textContent = await resposta.text();
            return;
        }

        var resumo = await resposta.json();
        atualizarGraficos(resumo);
        var totalSim = Number(resumo.totalSim);
        var totalInteresse = totalSim + Number(resumo.totalNao);

        document.getElementById("totalAvaliacoes").textContent = resumo.total;
        document.getElementById("mediaAvaliacoes").textContent =
            resumo.media === null ? "—" : Number(resumo.media).toLocaleString("pt-BR") + " de 5";
        document.getElementById("percentualInteresse").textContent =
            totalInteresse === 0 ? "—" : Math.round(totalSim / totalInteresse * 100) + "%";

        status.textContent = "";
    } catch (erro) {
        status.textContent = "Não foi possível carregar o resumo.";
    }
}

    // Atualiza os dados e repete a consulta após cinco segundos.
    async function atualizarDashboard() {
        await Promise.all([
            carregarResumo(),
            carregarComentarios()
    ]);

    setTimeout(atualizarDashboard, 5000);
}

    // Confere o login e o perfil antes de abrir o painel.
    if (!sessionStorage.ID_USUARIO) {
        window.location.replace("/login.html");
    } else if (sessionStorage.PERFIL_USUARIO !== "admin") {
        window.location.replace("/conte-para-nos.html");
    } else {
        mostrarComentarios(window.location.hash === "#comentarios");
        atualizarDashboard();
    }
    

    let proximaAtualizacao;

    // Trecho original do Web Data Viz para aquários.
    if (sessionStorage.AQUARIOS) {
        window.addEventListener("load", exibirAquariosDoUsuario);
    }

    function exibirAquariosDoUsuario() {
        var aquarios = JSON.parse(sessionStorage.AQUARIOS);
        aquarios.forEach(item => {
            document.getElementById("btnAquario").innerHTML += `
            <button class="btn-chart" onclick="exibirAquario(${item.id})" id="btnAquario${item.id}">${item.descricao}</button>
            `

            document.getElementById("graficos").innerHTML += `
                <div id="grafico${item.id}" class="display-none">
                    <h3 class="tituloGraficos">
                        <span id="tituloAquario${item.id}">${item.descricao}</span>
                    </h3>
                    <div class="graph">
                        <canvas id="myChartCanvas${item.id}"></canvas>
                    </div>
                    <div class="label-captura">
                        <p id="avisoCaptura${item.id}" style="color: white"></p>
                    </div>
                </div>
            `

            obterDadosGrafico(item.id)
        });

        if (aquarios.length > 0) {
            exibirAquario(aquarios[0].id)
        }
    }

    function alterarTitulo(idAquario) {
        var tituloAquario = document.getElementById(`tituloAquario${idAquario}`)
        var descricao = JSON.parse(sessionStorage.AQUARIOS).find(item => item.id == idAquario).descricao;
        tituloAquario.innerHTML = "Últimas medidas do <span style='color: #e6005a'>" + descricao + "</span>"
    }

    function exibirAquario(idAquario) {
        let todosOsGraficos = JSON.parse(sessionStorage.AQUARIOS);

        for (i = 0; i < todosOsGraficos.length; i++) {
            // exibindo - ou não - o gráfico
            if (todosOsGraficos[i].id != idAquario) {
                let elementoAtual = document.getElementById(`grafico${todosOsGraficos[i].id}`)
                if (elementoAtual.classList.contains("display-block")) {
                    elementoAtual.classList.remove("display-block")
                }
                elementoAtual.classList.add("display-none")

                // alterando estilo do botão
                let btnAtual = document.getElementById(`btnAquario${todosOsGraficos[i].id}`)
                if (btnAtual.classList.contains("btn-pink")) {
                    btnAtual.classList.remove("btn-pink")
                }
                btnAtual.classList.add("btn-white")
            }
        }

        // exibindo - ou não - o gráfico
        let graficoExibir = document.getElementById(`grafico${idAquario}`)
        graficoExibir.classList.remove("display-none")
        graficoExibir.classList.add("display-block")

        // alterando estilo do botão
        let btnExibir = document.getElementById(`btnAquario${idAquario}`)
        btnExibir.classList.remove("btn-white")
        btnExibir.classList.add("btn-pink")
    }

    // O gráfico é construído com três funções:
    // 1. obterDadosGrafico -> Traz dados do Banco de Dados para montar o gráfico da primeira vez
    // 2. plotarGrafico -> Monta o gráfico com os dados trazidos e exibe em tela
    // 3. atualizarGrafico -> Atualiza o gráfico, trazendo novamente dados do Banco

    // Esta função *obterDadosGrafico* busca os últimos dados inseridos em tabela de medidas.
    // para, quando carregar o gráfico da primeira vez, já trazer com vários dados.
    // A função *obterDadosGrafico* também invoca a função *plotarGrafico*

    //     Se quiser alterar a busca, ajuste as regras de negócio em src/controllers
    //     Para ajustar o "select", ajuste o comando sql em src/models
    function obterDadosGrafico(idAquario) {

        alterarTitulo(idAquario)

        if (proximaAtualizacao != undefined) {
            clearTimeout(proximaAtualizacao);
        }

        fetch(`/medidas/ultimas/${idAquario}`, { cache: 'no-store' }).then(function (response) {
            if (response.ok) {
                response.json().then(function (resposta) {
                    console.log(`Dados recebidos: ${JSON.stringify(resposta)}`);
                    resposta.reverse();

                    plotarGrafico(resposta, idAquario);

                });
            } else {
                console.error('Nenhum dado encontrado ou erro na API');
            }
        })
            .catch(function (error) {
                console.error(`Erro na obtenção dos dados p/ gráfico: ${error.message}`);
            });
    }

    // Esta função *plotarGrafico* usa os dados capturados na função anterior para criar o gráfico
    // Configura o gráfico (cores, tipo, etc), materializa-o na página e, 
    // A função *plotarGrafico* também invoca a função *atualizarGrafico*
    function plotarGrafico(resposta, idAquario) {

        console.log('iniciando plotagem do gráfico...');

        // Criando estrutura para plotar gráfico - labels
        let labels = [];

        // Criando estrutura para plotar gráfico - dados
        let dados = {
            labels: labels,
            datasets: [
            {
                label: 'Temperatura',
                data: [],
                fill: false,
                borderColor: 'rgb(199, 52, 52)',
                tension: 0.1
            }]
        };

        console.log('----------------------------------------------')
        console.log('Estes dados foram recebidos pela funcao "obterDadosGrafico" e passados para "plotarGrafico":')
        console.log(resposta)

        // Inserindo valores recebidos em estrutura para plotar o gráfico
        for (i = 0; i < resposta.length; i++) {
            var registro = resposta[i];
            labels.push(registro.momento_grafico);
            dados.datasets[0].data.push(registro.temperatura);
        }

        console.log('----------------------------------------------')
        console.log('O gráfico será plotado com os respectivos valores:')
        console.log('Labels:')
        console.log(labels)
        console.log('Dados:')
        console.log(dados.datasets)
        console.log('----------------------------------------------')

        // Criando estrutura para plotar gráfico - config
        const config = {
            type: 'line',
            data: dados,
        };

        // Adicionando gráfico criado em div na tela
        let myChart = new Chart(
            document.getElementById(`myChartCanvas${idAquario}`),
            config
        );

        setTimeout(() => atualizarGrafico(idAquario, dados, myChart), 2000);
    }


    // Esta função *atualizarGrafico* atualiza o gráfico que foi renderizado na página,
    // buscando a última medida inserida em tabela contendo as capturas, 

    //     Se quiser alterar a busca, ajuste as regras de negócio em src/controllers
    //     Para ajustar o "select", ajuste o comando sql em src/models
    function atualizarGrafico(idAquario, dados, myChart) {



        fetch(`/medidas/tempo-real/${idAquario}`, { cache: 'no-store' }).then(function (response) {
            if (response.ok) {
                response.json().then(function (novoRegistro) {

                    obterdados(idAquario);
                    // alertar(novoRegistro, idAquario);
                    console.log(`Dados recebidos: ${JSON.stringify(novoRegistro)}`);
                    console.log(`Dados atuais do gráfico:`);
                    console.log(dados);

                    let avisoCaptura = document.getElementById(`avisoCaptura${idAquario}`)
                    avisoCaptura.innerHTML = ""


                    if (novoRegistro[0].momento_grafico == dados.labels[dados.labels.length - 1]) {
                        console.log("---------------------------------------------------------------")
                        console.log("Como não há dados novos para captura, o gráfico não atualizará.")
                        avisoCaptura.innerHTML = "<i class='fa-solid fa-triangle-exclamation'></i> Foi trazido o dado mais atual capturado pelo sensor. <br> Como não há dados novos a exibir, o gráfico não atualizará."
                        console.log("Horário do novo dado capturado:")
                        console.log(novoRegistro[0].momento_grafico)
                        console.log("Horário do último dado capturado:")
                        console.log(dados.labels[dados.labels.length - 1])
                        console.log("---------------------------------------------------------------")
                    } else {
                        // tirando e colocando valores no gráfico
                        dados.labels.shift(); // apagar o primeiro
                        dados.labels.push(novoRegistro[0].momento_grafico); // incluir um novo momento

                        dados.datasets[0].data.shift();  // apagar o primeiro de temperatura
                        dados.datasets[0].data.push(novoRegistro[0].temperatura); // incluir uma nova medida de temperatura

                        myChart.update();
                    }

                    // Altere aqui o valor em ms se quiser que o gráfico atualize mais rápido ou mais devagar
                    proximaAtualizacao = setTimeout(() => atualizarGrafico(idAquario, dados, myChart), 2000);
                });
            } else {
                console.error('Nenhum dado encontrado ou erro na API');
                // Altere aqui o valor em ms se quiser que o gráfico atualize mais rápido ou mais devagar
                proximaAtualizacao = setTimeout(() => atualizarGrafico(idAquario, dados, myChart), 2000);
            }
        })
            .catch(function (error) {
                console.error(`Erro na obtenção dos dados p/ gráfico: ${error.message}`);
            });

    }
</script>
