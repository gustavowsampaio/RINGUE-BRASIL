
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ringue Brasil | Cadastro</title>

    <script src="./js/sessao.js"></script>

    <link rel="stylesheet" href="./css/estilo.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
</head>

<body onload="listar()">

    <!-- Cabeçalho -->

 <header class="cabecalho">

        <!-- Logo -->
        <div class="logo">
            <img src="css/WWEbrasilLOGO.png" alt="Logo Ringue Brasil">
        </div>

        <!-- Menu de navegação -->
        <nav class="menu">
            <a href="index.html">Início</a>
            <a href="#">Sobre</a>
            <a href="#">Sua experiência</a>
        </nav>

        <!-- Botão de entrada -->
        <div class="botao-entrar">
            <a href="login.html">ENTRAR</a>
        </div>

    </header>


    <!-- Tela de cadastro -->

    <main class="tela-cadastro">

        <section class="caixa-cadastro">

            <h1>Crie sua conta</h1>

            <form onsubmit="return cadastrar()">

                <div class="campo-cadastro">
                    <label for="nome_input">Nome:</label>
                    <input
                        id="nome_input"
                        type="text"
                        placeholder="Seu nome"
                    >
                </div>

                <div class="campo-cadastro">
                    <label for="email_input">E-mail:</label>
                    <input
                        id="email_input"
                        type="text"
                        placeholder="meuemail@provedor.com"
                    >
                </div>

                <div class="campo-cadastro">
                    <label for="senha_input">Senha:</label>
                    <input
                        id="senha_input"
                        type="password"
                        placeholder="Digite sua senha"
                    >
                </div>

                <div class="campo-cadastro">
                    <label for="confirmacao_senha_input">Confirmação da senha:</label>
                    <input
                        id="confirmacao_senha_input"
                        type="password"
                        placeholder="Confirme sua senha"
                    >
                </div>

                <button type="submit" class="botao-cadastro">
                    CADASTRAR
                </button>

                <a href="login.html" class="link-login">
                    Já possuo uma conta
                </a>

            </form>

            <!-- Mensagens de erro e sucesso -->

            <div class="alerta_erro">
                <div class="card_erro" id="cardErro">
                    <span id="mensagem_erro"></span>
                </div>
            </div>

            <!-- Carregamento -->

            <div id="div_aguardar" class="loading-div">
                <img src="./assets/circle-loading.gif" id="loading-gif">
            </div>

            <div id="div_erros_login"></div>

        </section>

    </main>


    <!-- JavaScript do cadastro -->

    <script>

        function cadastrar() {
    var nomeVar = nome_input.value;
    var emailVar = email_input.value;
    var senhaVar = senha_input.value;
    var confirmacaoSenhaVar = confirmacao_senha_input.value;

    if (
        nomeVar == "" ||
        emailVar == "" ||
        senhaVar == "" ||
        confirmacaoSenhaVar == ""
    ) {
        mensagem_erro.innerHTML = "Preencha todos os campos.";
        cardErro.style.display = "block";
        return false;
    }

    if (senhaVar != confirmacaoSenhaVar) {
        mensagem_erro.innerHTML = "As senhas não são iguais.";
        cardErro.style.display = "block";
        return false;
    }

    fetch("/usuarios/cadastrar", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            nomeServer: nomeVar,
            emailServer: emailVar,
            senhaServer: senhaVar
        })
    })
    .then(function (resposta) {
        if (resposta.ok) {
            mensagem_erro.innerHTML = "Cadastro realizado com sucesso!";
            cardErro.style.display = "block";

            setTimeout(function () {
                window.location = "login.html";
            }, 2000);
        } else {
            resposta.text().then(function (texto) {
                mensagem_erro.innerHTML = texto;
                cardErro.style.display = "block";
            });
        }
    })
    .catch(function (erro) {
        console.log(erro);
        mensagem_erro.innerHTML = "Erro ao realizar cadastro.";
        cardErro.style.display = "block";
    });

    return false;
}
    </script>

</body>

</html>
