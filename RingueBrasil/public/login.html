
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ringue Brasil | Login</title>

    <script src="./js/sessao.js"></script>

    <link rel="stylesheet" href="./css/estilo.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
</head>

<body>

    <!-- Cabeçalho -->

    <!-- navbar -->
<header class="cabecalho">

        <!-- Logo -->
        <div class="logo">
            <img src="css/WWEbrasilLOGO.png" alt="Logo Ringue Brasil">
        </div>

        <!-- Menu de navegação -->
        <nav class="menu">
            <a href="index.html">Início</a>
            <a href="#">Sobre</a>
            <a href="#">Sua experiência</a>
        </nav>

        <!-- Botão de entrada -->
        <div class="botao-entrar">
            <a href="login.html">ENTRAR</a>
        </div>

    </header>

    <!-- Tela de login -->

    <main class="tela-login">

        <section class="caixa-login">

            <h1>Entre na sua conta</h1>

            <form onsubmit="return entrar()">

                <!-- E-mail -->

                <div class="campo-email">

                    <label for="email_input">E-Mail:</label>

                    <input
                        id="email_input"
                        type="text"
                        name="email"
                    >

                </div>


                <!-- Senha e botão -->

                <div class="campo-senha">

                    <div class="senha-input">

                        <label for="senha_input">Senha:</label>

                        <input
                            id="senha_input"
                            type="password"
                            name="senha"
                        >

                    </div>

                    <button type="submit">ENTRAR</button>

                </div>


                <!-- Link para cadastro -->

                <a href="cadastro.html" class="link-cadastro">
                    Não possuo uma conta
                </a>

            </form>


            <!-- Mensagem de erro -->

            <div class="alerta_erro">

                <div class="card_erro" id="cardErro">

                    <span id="mensagem_erro"></span>

                </div>

            </div>


            <!-- Carregamento -->

            <div id="div_aguardar" class="loading-div">

                <img src="./assets/circle-loading.gif" id="loading-gif">

            </div>

            <div id="div_erros_login"></div>

        </section>

    </main>


    <!-- JavaScript de autenticação -->

    <script>

        function entrar() {

            aguardar();

            var emailVar = document.getElementById("email_input").value;
            var senhaVar = document.getElementById("senha_input").value;

            if (emailVar == "" || senhaVar == "") {

                document.getElementById("cardErro").style.display = "block";

                document.getElementById("mensagem_erro").innerHTML =
                    "Preencha todos os campos para continuar.";

                finalizarAguardar();

                return false;

            } else {

                setInterval(sumirMensagem, 5000);

            }

            console.log("FORM LOGIN: ", emailVar);

            fetch("/usuarios/autenticar", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    emailServer: emailVar,
                    senhaServer: senhaVar

                })

            }).then(function (resposta) {

                console.log("ESTOU NO THEN DO entrar()!");

                if (resposta.ok) {

                    console.log(resposta);

                    resposta.json().then(json => {

                        console.log(json);

                        sessionStorage.EMAIL_USUARIO = json.email;
                        sessionStorage.NOME_USUARIO = json.nome;
                        sessionStorage.ID_USUARIO = json.id;

                        setTimeout(function () {

                            window.location = "./dashboard/cards.html";

                        }, 1000);

                    });

                } else {

                    console.log("Houve um erro ao tentar realizar o login!");

                    resposta.text().then(texto => {

                        console.error(texto);

                        finalizarAguardar(texto);

                    });

                }

            }).catch(function (erro) {

                console.log(erro);

                finalizarAguardar();

            });

            return false;
        }


        function sumirMensagem() {

            document.getElementById("cardErro").style.display = "none";

        }

    </script>

</body>

</html>
